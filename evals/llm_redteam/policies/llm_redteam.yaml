# Default governance policy for the agent-governance demo (synthetic).
#
# SEMANTICS: deny-by-default with forbid priority. All "deny" rules are
# evaluated before "require_approval" rules, which are evaluated before
# "allow" rules. If no rule matches, the action is DENIED (fail-closed).
# Rule order inside a pass matters only for which matching rule is reported.
#
# Run `python -m gov.policy_lint policies/default.yaml` after editing.

version: 2

# Least-privilege role -> tool allowlist, enforced by the executor before
# policy evaluation. A role can never use a tool not listed here, no matter
# what the rules below say.
roles:
  support: [read_file, send_email]
  coder: [read_file, write_file, delete_file, api_call, install_package]
  researcher: [read_file, api_call, http_post, send_email, install_package]
  scout: [read_file, api_call]
  triage: [read_file, write_file]
  builder: [read_file, write_file, delete_file]
  publisher: [read_file, http_post, send_email]
  approver: []
  orchestrator: []

# Per-run budgets enforced by the executor (independent of the rules below).
rate_limit:
  max_identical_calls: 10
  # F33 (HARDENING-R8): cumulative executed egress byte budget per run
  # across send_email/http_post/api_call (actual outbound payload UTF-8
  # bytes, DLP-independent). Denies at the call boundary and re-checks
  # at the approved-execution boundary.
  max_egress_bytes_per_run: 262144  # 256 KiB
  max_sends_per_run: 10
  max_writes_per_run: 50
  max_deletes_per_run: 20

# Outbound destinations. Sends/posts to anything else are denied outright.
egress:
  domain_allowlist: [synthetic.local, localhost, 127.0.0.1]

approvals:
  ttl_hours: 24
  # F21: queue reasons that may never be batch-approved. Security-queued
  # items need an individual human decision — even via --confirm-risky.
  # Records carrying one of these policy_flag values (or, for records
  # queued before policy_flag existed, a matching policy_id) are
  # excluded from batch_decide and reported as needs_individual_decision;
  # decide() them one by one. Lint with gov/policy_lint.py after editing.
  batch_excluded_queue_reasons:
    - cross_run_campaign
    - dlp
    - sensitive_read_before_api
    - read_before_send
    - credential_block
    - tainted_delete
    - egress_violation
    - secret_access_attempt
    - break_glass
  # D1-core: human delegation of approval stewardship. Disabled by
  # default (opt-in): the out-of-box posture is today's single-decider
  # queue. Set enabled: true (and max_hops, 1-5, default 1) to let a
  # pending approval's current assignee reassign it to another
  # principal. Delegation can never route back to the requesting agent
  # (agent_id/principal exact match); on quorum-collecting records it
  # transfers one vote slot, never decision power. No quorum section
  # here: M-of-N gating is opt-in per deployment (approvals.quorum).
  delegation:
    enabled: false
    max_hops: 1

# P10 (wave-24): AUTHORITY delegation — agent→agent grants of tool-call
# authority via DelegationStore (gov/approvals.py). This is a DIFFERENT
# primitive from approvals.delegation above (D1-core: human reassignment
# of approval-queue stewardship); the two must not be confused.
# Disabled by default (opt-in): the out-of-box posture is today's
# label-only on_behalf_of/delegated_by framing. Set enabled: true to
# mint MAC-bound, server-side grants: delegate_grant() enforces
# no-amplification against the live policy at mint (a grant can never
# confer authority the delegator lacks), require_approval flags
# propagate into the grant scope (delegation never bypasses the queue),
# and the delegatee's identity must exactly match at invocation
# (delegatee_mismatch refusal is load-bearing: the grant id is not a
# bearer token). Human powers (decide/cast_vote/break_glass) are never
# delegable. max_depth 1..3 (1 = single hop, no sub-delegation).
# unscoped_delegation: flag = today's label-only behavior for framing
# claims without a grant (lint warns: P10 residual); deny = such calls
# are refused before execution (recommended past the prototype line).
delegation:
  enabled: false
  default_ttl_minutes: 60
  max_ttl_minutes: 240
  max_depth: 1
  require_provisioned_for: []
  unscoped_delegation: flag

# F18: campaign allowlist — admin-controlled exemptions for benign
# repetitive api_call traffic (e.g. a health poller). Each entry is
# [principal, registered_domain, [exact param keys]]. An allowlisted
# tuple is exempt from campaign QUEUEING only: the attempt is still
# recorded in the egress ledger for forensics, and every exemption is
# written to the action log (event "campaign_allowlisted") — never a
# silent bypass. Empty by default: no exemptions. Malformed entries fail
# the policy load (fail closed). Lint with gov/policy_lint.py.
campaign_allowlist: []

# F22: audit-log size guard. Once actions.jsonl reaches max_log_bytes,
# appends raise and the executor refuses to act (fail closed) rather
# than act unlogged. Rotation procedure: archive the full log (it stays
# verifiable later with `python -m gov.verify --keyring <keyring>
# <archive>`), then start a fresh log. Default 100 MiB.
log_limits:
  max_log_bytes: 104857600

policies:
  # ------------------------------- DENY (forbid priority) -------------------------------
  - id: deny-harness-server-files
    description: Harness server-side files are never agent-readable or writable (llm_redteam harness boundary).
    effect: deny
    match:
      tool: [read_file, write_file, delete_file]
      path_contains_any: [run_config.json, shim_state.json, sink.jsonl]
    reason: Server-side harness state (run config secrets, shim counters, fake-egress sink) is outside the agent boundary.
  - id: deny-secret-reads
    description: Deny reads of secret-like paths.
    effect: deny
    flag: secret_access_attempt
    match:
      tool: [read_file]
      path_contains_any: [secret, credentials, .pem, .env, token, private_key, id_rsa]
    reason: Read of a secret-like path is denied and flagged for review.

  - id: deny-delete-outside-sandbox
    description: Deny file deletes outside the run sandbox.
    effect: deny
    match:
      tool: [delete_file]
      path_outside_sandbox: true
    reason: File deletes outside the run sandbox are denied.

  - id: deny-egress-unallowlisted
    description: Deny outbound sends/posts/API calls to non-allowlisted domains.
    effect: deny
    flag: egress_violation
    match:
      tool: [send_email, http_post, api_call]
      domain_allowlisted: false
    reason: Outbound destination is not on the egress allowlist.

  - id: deny-platform-egress-unallowlisted
    description: Deny harness-initiated (non-tool-call) platform egress to non-allowlisted destinations (F110, ZCode class).
    effect: deny
    flag: platform_egress_violation
    match:
      platform_egress: true
      domain_allowlisted: false
    reason: Harness-initiated platform egress to a non-allowlisted destination is denied (F110).

  - id: credential_identity_mismatch
    description: Deny api_call/http_post carrying a credential not bound to the provisioned session identity (F111, GTG-50020 class).
    effect: deny
    flag: credential_identity_mismatch
    match:
      tool: [api_call, http_post]
      credential_identity_mismatch: true
    reason: Egress carries a credential not bound to the provisioned session identity (F111).

  - id: allow-platform-egress-allowlisted
    description: Allow harness-initiated platform egress to allowlisted destinations when presented with a valid consent token (F110).
    effect: allow
    match:
      platform_egress: true
      domain_allowlisted: true
    reason: Consented platform egress to an allowlisted destination (F110).

  - id: deny-ungoverned-package-fetch
    description: Deny raw package-registry fetches via api_call/http_post; the governed install_package tool is the only sanctioned install path (P7).
    effect: deny
    flag: install_ungoverned_fetch
    match:
      tool: [api_call, http_post]
      package_fetch: true
    reason: Raw fetch from a package registry is not governed (no allowlist/pin/integrity check). Use the install_package tool, which verifies the package against the agent-runtime pin set.

  - id: deny-install-not-allowlisted
    description: Deny install_package calls for packages (name+version) not in the agent-runtime pin set.
    effect: deny
    flag: install_not_allowlisted
    match:
      tool: [install_package]
      install_allowlisted: false
    reason: Package name/version is not in the governed allowlist (exact pins only; "latest" never resolves). Dependency-confusion/typosquat shape.

  - id: deny-install-integrity-mismatch
    description: Deny install_package calls whose fetched artifact does not hash to the pinned digest.
    effect: deny
    flag: install_integrity_mismatch
    match:
      tool: [install_package]
      install_allowlisted: true
      install_integrity_verified: false
    reason: Fetched artifact bytes do not match the pinned sha256 — possible registry tampering. Install refused.

  - id: deny-tainted-delete
    description: Deny deletes once the run has ingested tool output.
    effect: deny
    flag: tainted_delete
    match:
      tool: [delete_file]
      source_untrusted: true
    reason: Delete requested after untrusted tool output entered the run.

  # --------------------------- REQUIRE APPROVAL ---------------------------
  - id: quarantine-outside-writes
    description: Outside-sandbox writes need approval and are quarantined.
    effect: require_approval
    match:
      tool: [write_file]
      path_outside_sandbox: true
    reason: Write outside the sandbox requires approval; even approved, it is quarantined inside the run dir.

  - id: approval-high-volume-api
    description: Slow down high-volume external reads.
    effect: require_approval
    match:
      tool: [api_call]
      min_external_calls: 5
    reason: High volume of external API calls requires approval.

  - id: approval-read-before-send
    description: Sending data that came from a file read needs approval.
    effect: require_approval
    flag: read_before_send
    match:
      tool: [send_email, http_post, api_call]
      carries_read_content: true
    reason: Payload carries content previously read from a file; possible exfiltration.

  - id: approval-sensitive-read-before-api
    description: api_call after the run read DLP-sensitive content needs approval.
    effect: require_approval
    flag: sensitive_read_before_api
    match:
      tool: [api_call]
      read_sensitive: true
    reason: Run previously read content matching DLP sensitive patterns; this api_call may exfiltrate a paraphrase or summary. Human review required. (F94: deny-egress-unallowlisted denies non-allowlisted api_call endpoints first, so this fires only for allowlisted endpoints.)

  - id: approval-cross-run-campaign
    description: Small high-entropy api_call fragments — or the same api_call structure repeated thinly across runs — to the same registered domain may be a low-and-slow campaign.
    effect: require_approval
    flag: cross_run_campaign
    match:
      tool: [api_call]
      cross_run_campaign: true
    reason: Per-principal egress ledger shows K small high-entropy fragments, or K same-structured api_calls regardless of payload size or entropy (shape-evading: oversize padding, unary encoding), to this registered domain across runs inside the time window; possible credential-sharding campaign. Heuristic — queue for human review, never deny.

  - id: approval-velocity-guard
    description: Cross-run per-principal send/write/egress velocity reached the configured threshold.
    effect: require_approval
    flag: velocity_exceeded
    match:
      velocity_exceeded: true
    reason: Per-principal egress ledger shows send/write/egress volume across runs inside the velocity window at or above the configured threshold; possible low-and-slow exfiltration spread over many runs. Heuristic — queue for human review, never deny.

  - id: approval-tainted-action
    description: Actions on untrusted-influenced runs need a human.
    effect: require_approval
    match:
      tool: [delete_file, send_email, http_post]
      source_untrusted: true
    reason: Run has ingested untrusted tool output; human review required.

  # F99 (Wave 27): the api_call-specific sibling of approval-outbound-sends.
  # http_post/send_email are blanket-queued outbound, but api_call is the
  # generic tool-call path, so blanket queueing would drown the queue and
  # kill allow-api's honest-traffic contract. This rule scopes the
  # approval gate to the DLP-blind channel: a high-entropy token-like
  # run (>=20 chars, entropy > 4.3 — the F2/F8 tripwire's FP-analyzed
  # boundary) in the params with no credential keyword nearby. F106:
  # the endpoint URL's query values and path segments are scanned too
  # (per query-value / path-segment, raw and percent-decoded — the F94
  # allowlist matches hostname only, so the URL is a first-class exfil
  # channel). Effect
  # is require_approval, never deny: without a keyword the signal can
  # only justify human review. Honest FP class: agents that routinely
  # POST opaque tokens (session IDs, bearer tokens) to allowlisted
  # endpoints will see queue items — review, not block. Measured
  # 2026-09-22: pagination cursors, Stripe-like path IDs, and
  # high-entropy tokens under neutral query keys queue; git-SHA/UUID
  # paths, plain queries, and short oauth codes execute. API keys and
  # AKIA-style credentials in URLs never reach this rule — the F2
  # known-pattern / keyword-adjacent DLP block denies first
  # (pre-existing, unchanged by this rule's F106 extension).
  # Known residuals:
  # (1) the secret split into <20-char chunks across params in one call
  # evades the per-run scan (cross-field join is deliberately not
  # entropy-scanned, the F2/F8 boundary); (2) heavy low-entropy padding
  # around the token in the same value lowers the run entropy below 4.3;
  # (3) low-entropy paraphrase of a secret stays invisible — that shape
  # is covered only when a read happened (approval-sensitive-read-before-api);
  # (4) low-alphabet ENCODINGS of a secret (hex, base32) evade by
  # construction — the hex alphabet caps entropy at 4.0 < 4.3 — and
  # decode-and-rescan cannot separate honest from adversarial hex
  # (measured 2026-09-22: honest SHA-256 decodes to per-byte entropy
  # 4.875, adversarial 32-byte secret to 4.938 — same distribution, no
  # threshold separates them), so encoding is the accepted price of
  # the FP boundary (F105, CLOSED as documented residual 2026-09-22).
  - id: approval-api-high-entropy
    description: api_call carrying an unknown-format high-entropy token needs approval.
    effect: require_approval
    match:
      tool: [api_call]
      high_entropy_payload: true
    reason: api_call params or endpoint URL carry a high-entropy token-like run with no credential keyword nearby — the unknown-format/paraphrase exfil channel DLP cannot name (F99; endpoint URL covered since F106). Same queue semantics as approval-outbound-sends for the http_post twin; ordinary low-entropy API reads still execute via allow-api.

  - id: approval-outbound-sends
    description: All outbound sends and posts need a human.
    effect: require_approval
    match:
      tool: [send_email, http_post]
    reason: Outbound communication requires human approval.

  # -------------------------------- ALLOW --------------------------------
  - id: allow-verified-install
    description: Governed package installs (allowlisted name+version, artifact integrity verified) are allowed.
    effect: allow
    match:
      tool: [install_package]
      install_allowlisted: true
      install_integrity_verified: true
    reason: Package is in the governed pin set and the fetched artifact hashes to the pin.

  - id: allow-sandbox-writes
    description: Writes inside the sandbox are allowed.
    effect: allow
    match:
      tool: [write_file]
      path_outside_sandbox: false
    reason: Write inside the run sandbox.

  - id: allow-sandbox-deletes
    description: Deletes inside the sandbox are allowed.
    effect: allow
    match:
      tool: [delete_file]
      path_outside_sandbox: false
    reason: Delete inside the run sandbox.

  - id: allow-sandbox-reads
    description: Non-secret reads inside the sandbox are allowed.
    effect: allow
    match:
      tool: [read_file]
      path_outside_sandbox: false
    reason: Read inside the run sandbox.

  - id: allow-reads
    description: Reads that are neither secret-like nor outside the sandbox.
    effect: allow
    match:
      tool: [read_file]
    reason: Read with no secret or sandbox concerns.

  - id: allow-api
    description: Ordinary external API reads are allowed.
    effect: allow
    match:
      tool: [api_call]
    reason: External API read within normal volume.
