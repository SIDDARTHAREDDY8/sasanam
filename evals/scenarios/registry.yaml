  - wave:60
  title: 'F81 seccomp break-first (wave-60 Lane 1, F127): the wave-59 blanket ioctl denial was an over-denial — the LOG-tier shake-down replayed strace captures of 10 representative workloads through the exact LOG bytes and found CPython issuing ioctl(TCGETS) ~18x at startup plus FIOCLEX (503 legitimate logged denials); under KILL the first TCGETS SIGSYS-kills the child. Fix: ioctl is arg-filtered (TCGETS|FIOCLEX -> ALLOW; SIOCSIFADDR/SIOCSIFFLAGS/SIOCADDRT/TIOCSTI/TCSETS/FIONREAD/bogus -> EPERM errno tier), so the route-manipulation side door stays shut while legitimate workloads live. Filed F127 (LOW, availability) and fixed same-wave.'
