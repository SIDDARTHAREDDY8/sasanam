rules:
  -
    meta:
      name: "env primitive 0"
      namespace: capability/env/prim-00
      scopes:
        static: module
      capability_tags: [capability/env]
      label: "os.environ"
      description: "Byte-identical migration of the flat lint entry for category env."
    features:
      pattern: "\bos\.environ\b"
  -
    meta:
      name: "env primitive 1"
      namespace: capability/env/prim-01
      scopes:
        static: module
      capability_tags: [capability/env]
      label: "getenv("
      description: "Byte-identical migration of the flat lint entry for category env."
    features:
      pattern: "(?<![\w.])getenv\s*\("
